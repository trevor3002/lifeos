    <!-- Aggressive cleanup of stale Service Workers and Caches from earlier sessions -->
    <script>
      (function() {
        try {
          var hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
              if (hadController && regs.length > 0) {
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    for (var j = 0; j < names.length; j++) caches.delete(names[j]);
                    window.location.reload();
                  }).catch(function() { window.location.reload(); });
                } else {
                  window.location.reload();
                }
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var k = 0; k < names.length; k++) caches.delete(names[k]);
            }).catch(function() {});
          }
        } catch (e) {}

        // Global Error Fallback so the screen is never left grey if a module fails
        window.addEventListener('error', function(event) {
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0 || root.querySelector('.initial-loader'))) {
            var msg = (event && event.message) ? event.message : 'Initialization notice';
            
            // Detect if this is a script load error (usually means raw TSX is being served instead of a build)
            if (event.target && event.target.src && event.target.src.includes('main.tsx')) {
              msg = "<b>Deployment Error:</b> The browser cannot execute raw TypeScript (main.tsx). You must deploy the compiled <b>dist/</b> folder, not the raw source code. Please run 'npm run build' and deploy the output.";
            }

            root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:ui-sans-serif,system-ui,sans-serif;color:#f4f4f5;background:#0c0d10;"><div style="max-width:380px;width:100%;text-align:center;background:#14161a;border:1px solid #27272a;border-radius:16px;padding:28px 20px;"><div style="display:inline-flex;padding:12px;border-radius:12px;background:rgba(245,158,11,0.1);color:#fbbf24;margin-bottom:16px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div><h2 style="font-size:18px;font-weight:700;margin:0 0 8px;">Dashboard Initializing</h2><p style="font-size:13px;color:#a1a1aa;margin:0 0 20px;line-height:1.5;">' + msg + '</p><div style="display:flex;gap:10px;justify-content:center;"><button onclick="localStorage.clear();sessionStorage.clear();window.location.reload();" style="cursor:pointer;background:#27272a;color:#e4e4e7;border:1px solid #3f3f46;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;">Reset & Reload</button><button onclick="window.location.reload();" style="cursor:pointer;background:#f59e0b;color:#000;border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;">Reload App</button></div></div></div>';
          }
        }, true);
      })();
    </script>
